<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("@@FONT@@"); font-weight: 700; }
:root {
@@VARIABILI@@
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; }
.slide { width: 1080px; height: 1920px; position: relative; background: var(--fondo); color: var(--carta);
  font-family: "Segoe UI", sans-serif; overflow: hidden; margin-bottom: 40px; }
.n { position: absolute; top: var(--numero-alto); left: var(--margine); font: 700 var(--corpo-numero) "Archivo"; color: var(--grigio); letter-spacing: 2px; }
.t { position: absolute; top: var(--titolo-alto); left: var(--margine); right: var(--margine-destro); font: 700 var(--corpo-titolo)/1.0 "Archivo"; text-transform: uppercase; }
.fig { position: absolute; left: var(--margine); right: var(--margine-destro); }
.p { position: absolute; left: var(--margine); right: var(--margine-destro); font-size: var(--corpo-testo); line-height: 1.28; font-weight: 400; }
.p b { font-weight: 700; }
.g { color: var(--giallo); }
.r { color: var(--rosso); }
.lab { font: 700 var(--corpo-etichetta) "Archivo"; fill: var(--carta); }
.lab-s { font: 400 var(--corpo-nota) "Segoe UI"; fill: var(--grigio); }
</style>
</head>
<body>

<!-- Base di partenza: tre slide d'esempio da sostituire (apertura, un disegno, chiusa). Ogni section con classe slide è una slide.
     In basso resta libera la zona della didascalia, a destra quella dei bottoni di TikTok; i colori e le misure stanno in :root. -->

<!-- 1: apertura -->
<section class="slide">
  <div class="n">ARGOMENTO · 1/3</div>
  <div class="t" style="font-size:108px">Il titolo che fa fermare</div>
  <div class="p" style="top:620px; font-size:50px">Una riga che dice cosa si scopre:<br><b class="g">la cosa che conta di più.</b></div>
  <svg class="fig" style="top:830px; left:600px; right:auto" viewBox="0 0 330 300" width="330" height="300">
    <rect x="3" y="3" width="324" height="294" rx="26" fill="var(--scuro)" stroke="var(--carta)" stroke-width="6"/>
    <text x="165" y="195" text-anchor="middle" style="font:700 150px Archivo; fill:var(--giallo)">00</text>
  </svg>
@@STICKER@@
</section>

<!-- 2: un disegno invece di un elenco -->
<section class="slide">
  <div class="n">2/3</div>
  <div class="t">Il confronto</div>
  <svg class="fig" style="top:540px" viewBox="0 0 840 360" width="840" height="360">
    <text x="0" y="40" class="lab">PRIMA</text>
    <rect x="0" y="60" width="840" height="80" fill="var(--rosso)"/>
    <text x="830" y="112" text-anchor="end" class="lab" style="fill:var(--fondo)">100</text>
    <text x="0" y="220" class="lab">DOPO</text>
    <rect x="0" y="240" width="260" height="80" fill="var(--carta)"/>
    <text x="280" y="292" class="lab">31</text>
  </svg>
  <div class="p" style="top:1000px">Un numero per slide, <b class="g">con accanto da dove viene</b>.</div>
</section>

<!-- 3: la chiusa, una domanda che chiede l'esperienza di chi guarda -->
<section class="slide">
  <div class="n">3/3</div>
  <div class="t" style="font-size:118px">Tu che ne pensi?</div>
  <div class="p" style="top:640px; font-size:56px">E tu, l'hai provato?<br><b class="g">Com'è andata?</b></div>
  <svg class="fig" style="top:960px" viewBox="0 0 840 440" width="840" height="440">
    <rect x="0" y="0" width="840" height="440" rx="26" fill="var(--giallo)"/>
    <text x="420" y="350" text-anchor="middle" style="font:700 360px Archivo; fill:var(--fondo)">?</text>
  </svg>
</section>

</body>
</html>
