# L'uscita di una versione (`docs/APP.md`, «Installer e aggiornamenti»): un tag `vX.Y.Z` (o `vX.Y.Z-rc.N`) lancia le prove
# (il workflow `prove`), controlla la versione, costruisce l'installatore, lo firma su Windows, ne controlla la firma, scrive `latest.json` e crea l'uscita con installatore, firma e `latest.json`.
# Un'uscita senza firma non si pubblica: senza la chiave il workflow si ferma (un fork mette i suoi segreti, `docs/APP.md`, «La firma»).
# La chiave la legge solo il passo «Firma l'installatore»: prove, costruzione e pacchetti girano prima e senza.
# L'uscita nasce come bozza, si controlla che i tre file ci siano tutti e solo allora si pubblica: chi ha l'app non vede mai un'uscita a metà.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Le prove girano in un lavoro a parte, senza l'environment: l'approvazione si chiede solo se sono verdi.
  prove:
    uses: ./.github/workflows/prove.yml

  windows:
    needs: prove
    runs-on: windows-latest
    # I segreti della firma sono usabili solo dopo l'approvazione sull'environment.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Il tag è la versione dell'app
        run: |
          bun run app/installer/verifica-versione.ts --tag "$GITHUB_REF_NAME"
          echo "VERSIONE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NOTE=app/installer/note/$GITHUB_REF_NAME.md" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: La CLI di Tauri
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: I pacchetti di studio, animazioni e server
        run: |
          bun install --cwd studio --frozen-lockfile
          bun install --cwd animazioni --frozen-lockfile
          bun install --cwd server --frozen-lockfile

      - name: Costruzione
        working-directory: app
        run: bun run installer/costruisci.ts --senza-firma

      - name: Firma l'installatore
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "Manca il segreto TAURI_SIGNING_PRIVATE_KEY nell'environment release: un'uscita senza firma non si pubblica (docs/APP.md, «La firma»)."; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo "Manca il segreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD nell'environment release (docs/APP.md, «La firma»)."; exit 1; }
          bun run installer/costruisci.ts --solo-firma

      - name: La firma vale
        run: |
          installatore=$(ls app/target/release/bundle/nsis/*_"$VERSIONE"_x64-setup.exe)
          node app/installer/verifica-firma-tauri.mjs "$installatore" "$installatore.sig" app/tauri.conf.json
          echo "INSTALLATORE=$installatore" >> "$GITHUB_ENV"

      - name: latest.json
        working-directory: app
        run: bun run installer/pubblica.ts --versione "$VERSIONE" --indirizzo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" --note-file "../$NOTE"

      - name: L'uscita
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(dirname "$INSTALLATORE")/latest.json"
          { cat "$NOTE"; echo; echo "SHA-256 of the installer: \`$(sha256sum "$INSTALLATORE" | cut -d' ' -f1)\`"; } > note-uscita.md
          pre=(); stabile=1; case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease); stabile=0 ;; esac
          gh release create "$GITHUB_REF_NAME" --draft "${pre[@]}" --title "Mango Animation $VERSIONE" --notes-file note-uscita.md \
            "$INSTALLATORE" "$INSTALLATORE.sig" "$latest"

          # Si pubblica solo con tutti i file su, della dimensione che hanno qui (GitHub trasforma gli spazi dei nomi in punti).
          caricati=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"')
          for file in "$INSTALLATORE" "$INSTALLATORE.sig" "$latest"; do
            atteso="$(basename "$file" | tr ' ' '.') $(wc -c < "$file" | tr -d ' ')"
            grep -qxF "$atteso" <<< "$caricati" || { echo "La bozza non ha $atteso (ha: $(tr '\n' ';' <<< "$caricati"))"; exit 1; }
          done
          pubblica=(--draft=false); [ "$stabile" = 1 ] && pubblica+=(--latest)
          gh release edit "$GITHUB_REF_NAME" "${pubblica[@]}"
