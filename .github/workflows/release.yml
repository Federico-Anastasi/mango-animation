# L'uscita di una versione (`docs/APP.md`, «Installer e aggiornamenti»): un tag `vX.Y.Z` (o `vX.Y.Z-rc.N`) costruisce
# l'installatore firmato su Windows, ne controlla la firma, scrive `latest.json` e crea l'uscita con installatore, firma e `latest.json`.
# Un'uscita senza firma non si pubblica: senza la chiave il workflow si ferma subito (un fork mette i suoi segreti, `docs/APP.md`, «La firma»).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # I segreti della firma sono usabili solo dopo l'approvazione sull'environment.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Il tag è la versione dell'app
        run: |
          versione=$(node -p "require('./app/tauri.conf.json').version")
          [ "v$versione" = "$GITHUB_REF_NAME" ] || { echo "Il tag $GITHUB_REF_NAME non è la versione dell'app (v$versione, app/tauri.conf.json)."; exit 1; }
          note="app/installer/note/$GITHUB_REF_NAME.md"
          [ -f "$note" ] || { echo "Mancano le note dell'uscita: $note"; exit 1; }
          echo "VERSIONE=$versione" >> "$GITHUB_ENV"
          echo "NOTE=$note" >> "$GITHUB_ENV"

      - name: La chiave di firma c'è
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "Manca il segreto TAURI_SIGNING_PRIVATE_KEY nell'environment release: un'uscita senza firma non si pubblica (docs/APP.md, «La firma»)."; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || { echo "Manca il segreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD nell'environment release (docs/APP.md, «La firma»)."; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: La CLI di Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: I pacchetti di studio e animazioni
        run: |
          bun install --cwd studio --frozen-lockfile
          bun install --cwd animazioni --frozen-lockfile

      - name: Costruzione e firma
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run installer/costruisci.ts

      - name: La firma vale
        run: |
          installatore=$(ls app/target/release/bundle/nsis/*_"$VERSIONE"_x64-setup.exe)
          node app/installer/verifica-firma-tauri.mjs "$installatore" "$installatore.sig" app/tauri.conf.json
          echo "INSTALLATORE=$installatore" >> "$GITHUB_ENV"

      - name: latest.json
        working-directory: app
        run: bun run installer/pubblica.ts --versione "$VERSIONE" --indirizzo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" --note "$(head -n 1 "../$NOTE")"

      - name: L'uscita
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat "$NOTE"; echo; echo "SHA-256 of the installer: \`$(sha256sum "$INSTALLATORE" | cut -d' ' -f1)\`"; } > note-uscita.md
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Mango Animation $VERSIONE" --notes-file note-uscita.md \
            "$INSTALLATORE" "$INSTALLATORE.sig" "$(dirname "$INSTALLATORE")/latest.json"
