[package]
name = "mango-animation"
version = "0.1.5"
edition = "2021"
description = "Mango Animation: the archive and editing bench for your videos"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Federico-Anastasi/mango-animation"
authors = ["Federico Anastasi"]

[lib]
name = "mango_animation_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-win = "5"
cpal = "0.18"
png = "0.18"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinHttp"] }
tauri-plugin-updater = "2"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.dev]
# Le informazioni di debug complete pesano GB: solo le righe.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
