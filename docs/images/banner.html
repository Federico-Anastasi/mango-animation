<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    width: 1600px; height: 560px; box-sizing: border-box; border-radius: 28px; overflow: hidden; position: relative;
    background: #151518; border: 1px solid #36363c; font-family: Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .glow {
    position: absolute; left: 50%; top: 40px; width: 1100px; height: 420px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255, 166, 31, 0.16), rgba(240, 83, 43, 0.05) 60%, rgba(21, 21, 24, 0) 100%);
  }
  .mark { position: relative; display: flex; align-items: center; gap: 20px; }
  .mark svg { width: 176px; height: 176px; }
  .name { font-weight: 600; font-size: 128px; letter-spacing: -4px; line-height: 1; color: #eceae3; }
  .name span { color: #FFB022; }
  h1 { position: relative; margin: 44px 0 0; font-size: 46px; font-weight: 600; color: #eceae3; letter-spacing: -0.5px; }
  p { position: relative; margin: 16px 0 0; font-size: 28px; line-height: 1.5; color: #a29f96; font-weight: 400; }
</style>
</head>
